; ExStar Hub Mods - host and module switches.
; Copy this file to the application directory (next to "EXStar Hub.exe").
; All changes take effect after restarting the application.
; (The Mod Manager writes this file itself; the template is for manual
; installs.)

[host]
; 1 = write diagnostics to %LOCALAPPDATA%\ExStarHubMods\mod.log
log = 0
; multi-process support: also run the host inside sibling executables
; started by the app (e.g. scanservice.exe). marker_quality needs this -
; its scan side observes frames in the scan service. The Mod Manager
; maintains these two keys automatically when marker_quality is on.
; sibling_all = 1
; sibling_modules = marker_quality

[marker_inframe]
enabled = 1

[marker_quality]
enabled = 1
