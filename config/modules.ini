; ExStar Hub Mods - host and module switches.
; Copy this file to the application directory (next to "EXStar Hub.exe").
; All changes take effect after restarting the application.
; (The Mod Manager writes this file itself; the template is for manual
; installs. Sections left out are enabled by default, so a switch here is
; the way to turn a module OFF without deleting its files.)

[host]
; 1 = write diagnostics to %LOCALAPPDATA%\ExStarHubMods\mod.log
log = 0

; Multi-process support: the proxy in the application directory also lands
; in the helper executables the app starts (scanservice.exe, scanhub.exe,
; ...).  By default the host stays idle there.  Two modules need it:
;   marker_quality   - scan frames only arrive in scanservice.exe
;   selective_mesh   - the post-mesh data is built in scanservice.exe
; sibling_all wakes the host up in those processes, sibling_modules says
; which modules may load there.  The Mod Manager recomputes both keys
; from its module toggles on every install and remove - a module that is
; switched off is listed nowhere.  Hand-written values are reported and
; replaced on the next install.
; sibling_all = 1
; sibling_modules = marker_quality,selective_mesh

[marker_quality]
enabled = 1

[popup_dim]
enabled = 1

[wallpaper]
enabled = 1

[laser50]
enabled = 1

[gpu_gate]
enabled = 1

[selective_mesh]
enabled = 1
