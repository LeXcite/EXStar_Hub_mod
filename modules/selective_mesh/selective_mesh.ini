; selective_mesh - choose which scans go into the common mesh
;
; The stock product merges EVERY scan of a project that has "generate a
; point cloud" enabled into the common mesh; a bad or unrelated scan can
; only be avoided by deleting it (which destroys its data). This module
; adds a per-scan switch: a scan marked `included = 0` in
;   C:\Users\Public\Shining3d\EXStar Hub\selective-mesh.ini
; is left out of the common-mesh input, exactly like a scan whose cloud
; generation is off - its stored data, display and export stay intact.
;
; The selection file is created automatically on first use. If the file
; under the older name `merge-select.ini` exists, the module copies it
; to the new name once and leaves the old file untouched as a backup.
; The map file next to it (selective-mesh.map.txt) lists the scans seen
; during common-mesh runs with ready-to-copy section names:
;   [Project_1\Scan_2]
;   included = 0
;
; The manager's Selective Mesh card also has a "Scan roster" button:
; it lists the same scans with include checkboxes and writes this file
; for you. Changes apply to the next common-mesh run without a restart.
;
; Applies to the hub UI process; takes effect on the next start.

; 1 = log every per-scan gate decision (name, vendor flag, outcome)
;     to the mod log (needs [host] log = 1 in modules.ini)
verbose = 1

; 1 = watch the project-list eye icons (show/hide per scan): events are
;     logged and, with eye_gate on, persisted into the selection .ini
;     as [uuid] sections.  With eye_gate off this is recording only.
eyewatch = 1

; 1 = the eye icons decide participation: a scan whose row you hide is
;     left out of the next common mesh (an explicit section in
;     selective-mesh.ini still wins over the eye state)
eye_gate = 1

; 1 = put the eyes back after the scene switches environment.  Pressing
;     Mesh Model switches the scene environment and the vendor redraws the
;     project's models; the eye's hide lives on scene nodes, which the new
;     environment does not carry, so a hidden scan shows up on screen again
;     (the merged mesh is not affected - the gate excluded it anyway).
;     With this on, once the vendor's own switch has finished, every scan
;     you have hidden is sent back through the project list's own
;     show/hide slot, the same one an eye click uses, and the UI re-sends
;     its own hide command for the new environment.  Same process, same
;     thread, same object as the click; a fault stops it and leaves the
;     viewport stock.  Needs eyewatch = 1.
;     KNOWN DEFECT (1.6.1): calling the show/hide slot while the vendor's
;     post-process environment switch still owns the scene hangs the hub
;     (Application Hang, live evidence 2026-11-26) - the show half also
;     flashes every hidden scan on screen first.  So the default is 0 and
;     a hidden scan may re-appear on the viewport after Mesh Model; the
;     merged mesh still excludes it (eye_gate).  Opt in only knowing this.
eye_reapply = 0

; 1 = log the scene's own commands in the UI process.  The 3D view is
;     driven by named commands (SetModelsVisible, SetModelNodesVisible,
;     SetCurrentEnv).  This switch only LOGS what those commands ask for.
;     It is the diagnostic that produced the evidence in
;     docs/research/merge-common-mesh.md sections 11-17: an eye click sends
;     SetModelNodesVisible (the geometry nodes of one model), a Mesh Model
;     press sends SetCurrentEnv twice around the merge and no command that
;     names a model at all.
;
;     Reading a command is pure memory inspection: the type tag of each
;     value and its bytes are read where they are stored, the module never
;     calls into Qt from a scene command (1.5.0 did, and the hub faulted in
;     Qt5Core on start).  A value it cannot read is a value it ignores.
scene_watch = 1

; 1 = do not pass on a SetModelsVisible / SetModelNodesVisible that would
;     show a model this module has recorded as hidden by name.  On
;     2.1.0-10 nothing sends a command that names models while showing
;     them, so today this never fires and the name set stays empty: it is
;     kept because it would filter a vendor build that does send one, and
;     because it fails open.  The behaviour that actually keeps a hidden
;     scan hidden is eye_reapply above.
;     None of these switches touches the merged result - that is eye_gate.
scene_filter = 0

; which host processes may carry live hooks (comma separated exe names).
; The merge gate runs in the service process that collects the post-mesh
; data; the eye icons live in the QML UI process.  Every other process
; keeps a completely inert module - a hook in an unrelated service can
; take that service down (vendor error 0x00000012 on project open).
;gate_exes = EXStar Hub.exe,scanservice.exe,Sn3DprocessManager.exe
;eyewatch_exes = EXStar Hub.exe

; optional: full path to the selection .ini
; (default C:\Users\Public\Shining3d\EXStar Hub\selective-mesh.ini;
;  the .map.txt always sits next to it; the automatic migration from
;  merge-select.ini only runs when this key is not set)
;file = C:\Users\Public\Shining3d\EXStar Hub\selective-mesh.ini
