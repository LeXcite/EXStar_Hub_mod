; Popup Dim - configuration (modules\popup_dim.ini)
; The vendor paints a heavy grey "curtain" behind modal popups: a fully
; opaque blurred snapshot of the window (Sn3DDialog overlays in
; CompositeComponents.dll), a ~65% black rectangle (AppUi.dll) and a
; blurred + 50% black veil in the cloud dialog (Sn3DCloudDisk.dll).
; This module rewrites those QML literals in process memory the instant
; the UI DLLs are mapped (load-image callback, before the QML engine can
; compile them) - nothing on disk changes and a plain restart restores
; the stock behaviour.

; curtain opacity for the modal overlays, in percent (0..100)
; 0 = fully see-through (recommended), 100 = stock-like solid.
; The QML literals only offer 0.1 steps, so the value is rounded to the
; nearest tenth (e.g. 20 -> 0.2).
dim_alpha = 0

; 1 = also soften the blur itself (radius 7.5 -> 0.1, loops 10/50 -> 1,
; cloud GaussianBlur radius 16 -> 1). 0 keeps the stock blur parameters
; and only changes the overlay opacity.
soft_blur = 1

; UI DLLs to scan for QML overlay definitions
modules = AppUi.dll,CompositeComponents.dll,Sn3DCloudDisk.dll
; (in addition these are always scanned, no need to list them:
;  qtquickcontrols2plugin.dll - its default templates dim modals with 50%
;  black "palette.shadow", rewritten to dim_alpha too; ScanPage_E7.dll and
;  pluginSn3DNavigation.dll - carry extra copies of the blurred-overlay
;  QML, found through the compressed-stream pass)

; 1 = log every patched pattern hit to mod.log
verbose = 1

; note: the module also sets QML_DISABLE_DISK_CACHE=1 in the process so
; the QML engine recompiles the patched sources instead of replaying
; its on-disk cache in %LOCALAPPDATA%\EXStar Hub\cache\qmlcache
; (UI startup gets a little slower - that is expected and harmless).
