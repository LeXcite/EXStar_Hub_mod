; Marker In-Frame - configuration (modules\marker_inframe.ini)
; A marker recognized in the current scan frame no longer flashes red:
; it grows `scale` times while it stays in the frame. Size is the only
; cue - the disc keeps its current color, so Marker Quality colors
; survive the enlargement (the two modules cooperate automatically).

; size multiplier while in frame (1.0 .. 4.0)
scale = 1.6

; RGB used in place of a red disc/ring upload (floats 0..1, alpha is
; kept). Defaults match the "not in frame" white. Only the vendor's
; own red is replaced - quality colors are never touched.
color_inner = 1 1 1
color_ring  = 1 1 1

; 1 = write marker shader diagnostics to
;   %LOCALAPPDATA%\ExStarHubMods\mod.log (needs [host] log = 1)
probe = 0
