; Wallpaper - configuration (modules\wallpaper.ini)
; Replaces the application background image in process memory. The
; vendor embeds the wallpaper as an uncompressed JPEG inside AppUi.dll;
; this module overwrites that JPEG in the mapped image the moment the
; DLL loads. The picture itself is placed by the Mod Manager
; ("Фон приложения" button) as modules\wallpaper.jpg - the manager
; converts any jpg/png/bmp to 1920x1080 JPEG fitted into the slot.
; Nothing on disk of the vendor is modified: "Сброс" in the manager
; deletes modules\wallpaper.jpg and the stock wallpaper is back.

; DLL carrying the wallpaper image
target = AppUi.dll

; image file next to this module (in the app's modules\ folder)
file = wallpaper.jpg

; only run in a process whose executable name contains this (the hub);
; sibling processes like scanservice.exe skip the module. empty = all
exe = hub

; smallest JPEG accepted as the wallpaper slot (bytes); UI icons are
; far smaller, so the largest JPEG above this size is the wallpaper
min_slot = 300000

; 1 = log slot/patch details to mod.log
verbose = 1
