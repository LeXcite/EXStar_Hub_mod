; merge_select - choose which scans go into the common mesh
;
; The stock product merges EVERY scan of a project that has "generate a
; point cloud" enabled into the common mesh; a bad or unrelated scan can
; only be avoided by deleting it (which destroys its data). This module
; adds a per-scan switch: a scan marked `included = 0` in
;   C:\Users\Public\Shining3d\EXStar Hub\merge-select.ini
; is left out of the common-mesh input, exactly like a scan whose cloud
; generation is off - its stored data, display and export stay intact.
;
; The selection file is created automatically on first use. The map
; file next to it (merge-select.map.txt) lists the scans seen during
; common-mesh runs with ready-to-copy section names:
;   [Project_1\Scan_2]
;   included = 0
;
; The manager's Merge Selection card also has a "Scan roster" button:
; it lists the same scans with include checkboxes and writes this file
; for you. Changes apply to the next common-mesh run without a restart.
;
; Applies to the hub UI process; takes effect on the next start.

; 1 = log every per-scan gate decision (name, vendor flag, outcome)
;     to the mod log (needs [host] log = 1 in modules.ini)
verbose = 1

; 1 = watch the project-list eye icons (show/hide per scan): events are
;     logged and, with eye_gate on, persisted into the selection .ini
;     as [uuid] sections.  With eye_gate off this is recording only.
eyewatch = 1

; 1 = the eye icons decide participation: a scan whose row you hide is
;     left out of the next common mesh (an explicit section in
;     merge-select.ini still wins over the eye state)
eye_gate = 1

; 1 = watch the scene's own commands in the UI process.  The 3D view is
;     driven by named commands (SetModelsVisible, SetModelNodesVisible,
;     SetCurrentEnv): the eye icons hide a model by name, and entering
;     the Mesh Model page asks the scene to show every project again
;     (names=[all of them] reset=1 visible=1).  This switch only LOGS
;     what those commands ask for, in the mod log.
;
;     Reading a command is pure memory inspection: the type tag of each
;     value and its bytes are read where they are stored, the module never
;     calls into Qt from a scene command (1.5.0 did, and the hub faulted in
;     Qt5Core on start).  A value it cannot read is a value it ignores.
scene_watch = 1

; 1 = what you hid with the eye icon stays hidden in the 3D view.  The
;     module remembers which model names you hid and does not pass on a
;     request to show several models at once (that is what the Mesh Model
;     page sends) while one of them is hidden - so nothing is re-shown
;     and nothing has to be re-hidden afterwards.  Showing a single model
;     is always your own click: it goes through and is forgotten.
;     Neither switch touches the merged result - that is eye_gate.
scene_filter = 1

; which host processes may carry live hooks (comma separated exe names).
; The merge gate runs in the service process that collects the post-mesh
; data; the eye icons live in the QML UI process.  Every other process
; keeps a completely inert module - a hook in an unrelated service can
; take that service down (vendor error 0x00000012 on project open).
;gate_exes = EXStar Hub.exe,scanservice.exe,Sn3DprocessManager.exe
;eyewatch_exes = EXStar Hub.exe

; optional: full path to the selection .ini
; (default C:\Users\Public\Shining3d\EXStar Hub\merge-select.ini;
;  the .map.txt always sits next to it)
;file = C:\Users\Public\Shining3d\EXStar Hub\merge-select.ini
