; fitfill - configuration (modules\fitfill.ini)
; "Zoom to Fit" (Ctrl+D) frames the model into the viewport instead of
; leaving it at ~1/3 of the window. Two mechanisms, one per vendor era;
; both are in-memory only, nothing on disk changes, a restart restores
; stock behaviour.
;
; A) up to 2.0.0-45: the manipulator's "zoom optimization" mode (a
;    pinned camera distance) is enabled at view init; the module detours
;    the exported setter CustomizeManipulator::setIsZoomOptimization and
;    forwards a fixed value instead. On 2.1.0-10 the flag is dead code
;    (nobody reads it) - the hook stays armed as a harmless no-op there.
; B) from 2.1.0-10: the fit pipeline consults the digit singleton's
;    "scan scale" mode; sn3d.digit.scenecontrol.dll turns it OFF via one
;    call site (instance->setEnableScanScale(false)). The module
;    rewrites the bool-argument setup bytes of exactly that call site,
;    anchored through the import table (never a fixed offset).

; --- A) zoom-optimization setter hook ---------------------------------

; DLL exporting the setter (loaded wherever 3D views render)
target = librenderkit.dll

; substring of the mangled export name; must match exactly one export
needle = ?setIsZoomOptimization@CustomizeManipulator@@

; value to forward: 0 = zoom optimization OFF -> fit fills the frame
force = 0

; log the first N set() calls (verification trail)
log_calls = 6

; --- B) scan-scale call site (2.1.0-10) --------------------------------

; 0 disables mechanism B entirely
scan_scale = 1

; DLL containing the call site
ss_target = sn3d.digit.scenecontrol.dll

; the call must target the IAT slot importing this name (substring,
; lowercase as stored in the import table) from this DLL (substring)
ss_import = ?setEnableScanScale@RenderKitExtDigitSingleton@
ss_dll    = extensions.digit

; bool to force at the call site: 1 = scan scale ON -> fit fills the frame
ss_force = 1

; --- common ------------------------------------------------------------

; 1 = log details to mod.log
verbose = 1
