; ui_probe v2 - dev diagnostic module (not part of the release, never embedded)
; READ-ONLY: no code hooks, nothing is patched. A private thread walks the
; Qt Quick scene through exported Qt methods and logs every item that covers
; most of the window (the grey curtain) whenever that covering set changes.

; an item counts as a "cover" when its size is at least this percent of the
; content root in both dimensions (and it sits at the origin, opacity > 0)
min_pct = 80

; scene sweep interval, ms (>=200)
poll_ms = 700

; how deep below the root to walk each tree (1..12)
depth = 6

; 1 = log the full QWidget tree overview once (<=80 lines) so the UI
; framework structure is visible; then only covering-widget snapshots
dump_tree = 1

; total log lines before the probe goes quiet
max_lines = 400

; 1 = poll; 0 keeps the thread parked (no reads at all)
enabled = 1
