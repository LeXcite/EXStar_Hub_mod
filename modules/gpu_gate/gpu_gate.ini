; gpu_gate - let integrated GPUs pass the vendor startup GPU check
;
; The vendor's splash-screen check only lets DISCRETE GPUs reach its own
; AMD/NVIDIA model detection; an integrated GPU (e.g. a Radeon 780M in an
; iGPU-only PC) is refused with a "requires NVIDIA GeForce RTX 3060 /
; Vulkan 1.2" dialog and the app quits. This module relaxes that one
; comparison in the process's private memory copy of Sn3DSpeckleNew.dll
; (never on disk): integrated GPUs then run the vendor's own checks and
; pass them out of the box. Virtual GPUs and CPU Vulkan devices stay
; refused, exactly like before.
;
; On machines that already pass (discrete NVIDIA/AMD) the module changes
; nothing. Requires a restart after toggling.

; module file(s) whose mapped image carries the gate, comma separated,
; matched case-insensitively against DLL basenames
modules = sn3dspecklenew.dll

; 1 = log the pattern hit and the patched RVA to the mod log
;     (needs [host] log = 1 in modules.ini)
verbose = 1
