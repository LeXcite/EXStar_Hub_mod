; fps - configuration (modules\fps.ini)
; Adds a live "FPS: N" readout at the bottom right of the scan page.
; The module inserts a small QML Text block (frame counter on the
; window's frameSwapped signal + 1 s sampler) into the compressed QML
; resource of the scan page at DLL-load time. Nothing on disk changes;
; a plain restart restores the stock UI. The number is the REAL UI
; frame rate (frames actually presented per second), not the capture
; pipeline rate the vendor panel shows.

; DLL carrying the scan page QML resource
target = ScanPage_E7.dll

; identifies the scan page QML record inside the DLL (a comment line)
anchor = /// ScanPage_E7

; the block is inserted after the first line containing this text
insert_after = id: root

; label position: right/bottom margins in px
right  = 62
bottom = 56

; font (quotes protect the # from the ini comment syntax)
size  = 16
color = "#8ecbff"

; 1 = log patch details to mod.log
verbose = 1
