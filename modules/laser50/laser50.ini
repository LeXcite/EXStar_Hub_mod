; laser50 - configuration (modules\laser50.ini)
; The complete "50 laser lines" feature, one switch:
;   [lines]   widens the match plane-id window so all 25+25 lines reach
;             the cloud: detours the exported set_match_plane_id_vulkan
;             (by NAME, no offsets) and replaces the vendor tuple
;             (3,21,3,21) with (0,24,0,24); other tuples (7-line mode)
;             pass through untouched.
;   [caption] the Light Source Mode button then reads "50 lines": the
;             QML label is qsTr("%1线").arg($scanSettingModelLaser.
;             crossLaserLineShowNum) (=39); only the formatted number
;             is rewritten to 50, so the vendor translation catalogs
;             keep providing the suffix in the UI language (EN
;             "50 lines"). The "7 lines" button stays stock.
; Nothing on disk changes at runtime; disable with [laser50] enabled=0
; in modules.ini (or the Mod Manager switch) and restart.

; ---------- [lines] the plane-id remap ----------

; DLL carrying the export (loaded dynamically in scan processes)
target_module = algorithmLzy.dll

; substring of the mangled export name; must match exactly one export
needle = set_match_plane_id_vulkan@

; 1 = only rewrite the exact from_* tuple (other calls, e.g. the 7-line
;     mode, pass through untouched); 0 = rewrite every call (not advised)
strict = 1

; the vendor tuple to replace ...
from_left_start  = 3
from_left_end    = 21
from_right_start = 3
from_right_end   = 21

; ... and its replacement (25+25 lines)
to_left_start    = 0
to_left_end      = 24
to_right_start   = 0
to_right_end     = 24

; log the first N calls with their real values (verification trail)
log_calls = 6

; ---------- [caption] the "50 lines" button label ----------

; 0 = keep the stock "39" on the button (remap still active)
captions = 1

; DLL carrying the scan page settings QML (compressed qrc records)
cap_target = ScanPage_E7.dll

; identifies the record (a QML provider name, unique in the target file)
cap_anchor = ScanSettingModelProviderLaser

; exact bytes to replace ... (UTF-8 as in the QML source; the translated
; "%1线" string itself must NOT be reworded - that breaks the catalog
; lookup and leaks raw text into every locale)
cap_pattern = qsTr("%1线").arg($scanSettingModelLaser.crossLaserLineShowNum)

; ... and its replacement (the hanzi source stays; catalogs translate)
cap_replacement = qsTr("%1线").arg(50)

; safety: patch only when the pattern occurs exactly this many times
cap_expected = 1

; ---------- common ----------

; 1 = log details to mod.log
verbose = 1
