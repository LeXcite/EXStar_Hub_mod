; Marker Quality - configuration (modules\marker_quality.ini)
; This module owns everything a tracking marker looks like:
;   disc    - how well the scanner has observed the marker
;               red    seen at all
;               yellow frames >= yellow_frames and supported >= yellow_supported
;               green  frames >= green_frames, RMS spread <= green_spread_um
;                      and supported >= green_supported (latches until a new
;                      project)
;   outline - the marker is in the scanner's view right now. The vendor's
;             red flash is replaced by this outline, so quality stays
;             readable while you are still scanning the marker.

; --- green stage thresholds -----------------------------------------
green_frames     = 20    ; observations of the marker in good frames
green_spread_um  = 100   ; max RMS spread of the world position, micrometres
green_supported  = 4     ; distinct >=20deg direction slots with >=3 frames

; --- yellow stage thresholds ----------------------------------------
yellow_frames    = 8
yellow_supported = 2

; --- quality colors (0..255 integers) --------------------------------
; Keep red_r below 140 with low green/blue: "in the scanner's view" is
; detected by reading back the vendor's red (R >= 0.55, G <= 0.38,
; B <= 0.38), so a bright quality-red would read as in-view and light up
; an outline on a marker nobody is looking at. yellow and green are far
; from those limits.
red_r    = 128  red_g    = 24  red_b    = 24
yellow_r = 255  yellow_g = 200 yellow_b = 25
green_r  = 40   green_g  = 215 green_b  = 60

; --- in-view cue ------------------------------------------------------
; 0 turns it off entirely: markers look exactly like the vendor made them
; (quality colors keep working).
inframe      = 1

; the color itself. It only has to be clearly different from the quality
; colors (red / yellow / green) and from the marker's own black and white.
; Blue is used here because every quality stage is red, yellow or green.
inframe_r    = 0
inframe_g    = 120
inframe_b    = 255
inframe_a    = 255    ; alpha 0..255; 255 = fully opaque

; where the cue is drawn:
;   ring - the marker outline (default): the disc keeps showing quality
;   disc - the disc itself is painted, so a marker in view hides its
;          quality color for as long as it is in view
inframe_where = ring

; 1 = when the marker's own StateSet has no ring channel - which is the stock
; case, measured live: the ring comes from a channel one StateSet BELOW the
; marker and several markers reach that same one - the module gives the marker a
; channel of its own (the vendor's own getOrCreateUniform, value type copied from
; the disc uniform) and arms it with OVERRIDE_VALUES, the only thing in OSG that
; makes a StateSet win against one below it.  That entry is painted while the
; marker is in the scanner's view and removed again when the marker leaves, so
; the ring is the vendor's again with whatever value it holds then; the marker's
; map is read again every frame, because the vendor replaces markers while it
; scans and nothing may be remembered from the previous one.
; 0 = nothing is created: for a marker whose ring is not its own the cue stays
; off. mod.log says which case you are in.
inframe_create = 1

; 1 = a marker that is in view but has no quality data yet shows a white
; disc instead of the vendor's red flash (nothing red is left anywhere).
; 0 = leave the vendor red on exactly those markers.
hide_red     = 1

; --- diagnostics ------------------------------------------------------
verbose          = 1     ; 0 keeps quiet: no calibration/binding/heartbeat logs
report_ms        = 5000  ; scan-side calibration log cadence, ms
publish_ms       = 300   ; min gap between bridge file writes, ms

; --- sides (1 = active; diagnostics only, both default on) -----------
scan_side        = 1     ; frame observation in scanservice.exe
paint_side       = 1     ; recoloring in the hub renderer
